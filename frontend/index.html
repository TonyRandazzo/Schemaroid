<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <title>Schemaroid — Schemi e diagrammi collegati</title>
    <meta
      name="description"
      content="Schemaroid è un editor visuale per costruire schemi e diagrammi: forme collegabili da ogni lato, più schemi per progetto e collegamenti tra schemi."
    />
    <link rel="canonical" href="https://schemaroid.netlify.app/" />
    <meta name="theme-color" content="#2A2F3E" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Schemaroid" />
    <meta property="og:title" content="Schemaroid — Schemi e diagrammi collegati" />
    <meta
      property="og:description"
      content="Editor visuale per schemi e diagrammi, con forme collegabili da ogni lato e collegamenti tra schemi."
    />
    <meta property="og:url" content="https://schemaroid.netlify.app/" />
    <meta property="og:image" content="https://schemaroid.netlify.app/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('theme-storage'));
          var theme = saved && saved.state && saved.state.theme;
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
